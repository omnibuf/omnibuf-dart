name: Release & Publish to pub.dev

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Verify, Publish to pub.dev (OIDC) & Create GitHub Release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools via mise
        uses: jdx/mise-action@v5
        with:
          install: true

      - name: Install Go for conformance-runner
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install conformance-runner
        run: go install github.com/omnibuf/omnibuf-go/cmd/conformance-runner@latest

      - name: Install Dart dependencies
        run: just install

      - name: Run full CI verification
        run: just ci

      - name: Validate pub.dev package dry-run
        run: dart pub publish --dry-run

      - name: Publish to pub.dev via OIDC
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          PUB_TOKEN=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" | jq -er .value)
          export PUB_TOKEN
          dart pub token add https://pub.dev --env-var=PUB_TOKEN
          dart pub publish --force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
